<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player Pro</title>
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: #ffffff; --accent: #4a9eff; --sub-text: #888; --border: #ddd; }
        .light-mode { --bg: #1a1a1a; --text: #f0f0f0; --card: #222; --accent: #73b8ff; --sub-text: #aaa; --border: #444; }

        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; transition: 0.3s; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .screen { display: flex; flex-direction: column; align-items: center; padding: 30px; box-sizing: border-box; width: 100%; max-width: 480px; background: var(--card); border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* UI Player */
        .disk { width: 180px; height: 180px; background: #333; border-radius: 50%; margin-bottom: 20px; border: 5px solid var(--text); }
        #title { font-size: 18px; margin-bottom: 20px; text-align: center; font-weight: 600; }
        
        /* Thanh tiến trình và Thời gian */
        .progress-container { width: 100%; max-width: 350px; height: 8px; background: #ddd; border-radius: 5px; cursor: pointer; margin-bottom: 5px; }
        #progress { height: 100%; width: 0%; background: var(--accent); border-radius: 5px; transition: width 0.1s linear; }
        .time-info { width: 100%; max-width: 350px; display: flex; justify-content: space-between; font-size: 12px; color: var(--sub-text); margin-bottom: 20px; }

        .controls { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
        .btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 10px; transition: 0.2s; color: var(--text); }
        .btn:hover { transform: scale(1.2); }
        #playBtn { font-size: 40px; }
        .active { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

        /* UI List */
        #list-screen { display: none; }
        .list-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }
        ul { width: 100%; list-style: none; padding: 0; max-height: 40vh; overflow-y: auto; }
        li { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border); }
        li:hover { background: rgba(0,0,0,0.02); }
        .song-name { flex: 1; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
        .menu-btn { cursor: pointer; font-size: 20px; padding: 5px; color: var(--sub-text); }
        
        .btn-action { background: var(--accent); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 15px; font-weight: bold; }
        .btn-action:hover { opacity: 0.9; }
        select { padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
        .theme-btn { position: absolute; top: 20px; right: 20px; cursor: pointer; padding: 8px 15px; border-radius: 20px; background: var(--card); color: var(--text); border: 1px solid var(--border); }

        /* Modal & Toast */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: var(--card); padding: 25px; border-radius: 20px; width: 320px; text-align: center; }
        .modal-box input { width: 90%; padding: 10px; margin: 15px 0; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
        #toast { visibility: hidden; min-width: 250px; background-color: var(--accent); color: #fff; text-align: center; border-radius: 25px; padding: 16px; position: fixed; z-index: 999; bottom: 30px; left: 50%; transform: translateX(-50%); opacity: 0; transition: 0.5s; }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

<button class="theme-btn" onclick="document.body.classList.toggle('light-mode')">☀️/🌙</button>

<div id="player-screen" class="screen">
    <div class="disk"></div>
    <h2 id="title">Chưa chọn bài</h2>
    
    <div class="progress-container" onclick="seek(event)"><div id="progress"></div></div>
    <div class="time-info">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <div class="controls">
        <button class="btn" id="shuffle-btn" onclick="isShuffle=!isShuffle; this.classList.toggle('active')">🔀</button>
        <button class="btn" onclick="prevSong()">⏮️</button>
        <button class="btn" id="playBtn" onclick="togglePlay()">▶️</button>
        <button class="btn" onclick="nextSong()">⏭️</button>
        <button class="btn" id="loop-btn" onclick="isLoop=!isLoop; this.classList.toggle('active'); audio.loop=isLoop;">🔂</button>
    </div>
    <button class="btn-action" onclick="showList()">Thư viện nhạc</button>
</div>

<div id="list-screen" class="screen">
    <div class="list-header">
        <div style="display:flex; gap: 5px;">
            <button class="btn-action" onclick="document.getElementById('file-input').click()">+ Thêm</button>
            <button class="btn-action" style="background: #2ecc71" onclick="openInputModal('Tạo Playlist mới', createPlaylist)">+ Playlist</button>
        </div>
        <select id="sort-select" onchange="sortPlaylist()">
            <option value="default">Sắp xếp...</option>
            <option value="alpha">Tên A-Z</option>
            <option value="date">Ngày thêm</option>
        </select>
    </div>
    <input type="file" id="file-input" multiple style="display:none" onchange="addSongs(event)">
    <select id="playlist-select" onchange="renderPlaylist()" style="width:100%; margin-bottom:10px;"></select>
    <ul id="playlist"></ul>
    <button class="btn-action" style="background:#888; width:100%; margin-top: 15px;" onclick="showPlayer()">Quay lại</button>
</div>

<div id="input-modal" class="modal-overlay">
    <div class="modal-box">
        <h3 id="input-modal-title">Tiêu đề</h3>
        <input type="text" id="modal-input" placeholder="Nhập tên...">
        <button class="btn-action" onclick="processModal()">Xác nhận</button>
        <button class="btn-action" style="background:#888" onclick="closeInputModal()">Hủy</button>
    </div>
</div>

<div id="select-modal" class="modal-overlay">
    <div class="modal-box">
        <h3>Thêm vào Playlist</h3>
        <select id="target-playlist-select" style="width:100%; margin: 15px 0;"></select>
        <button class="btn-action" onclick="confirmAddToPlaylist()">Thêm</button>
        <button class="btn-action" style="background:#888" onclick="closeSelectModal()">Hủy</button>
    </div>
</div>

<div id="toast"></div>
<audio id="audio"></audio>

<script>
    let library = [{ name: "Tất cả bài hát", items: [] }]; 
    let playlistIndex = 0, index = 0, isLoop = false, isShuffle = false;
    let songToAdd = null, currentCallback = null;

    const audio = document.getElementById('audio'), playBtn = document.getElementById('playBtn'), 
          progress = document.getElementById('progress'), title = document.getElementById('title'),
          currTimeEl = document.getElementById('current'), durTimeEl = document.getElementById('duration');

    // Hàm gọi thông báo
    function showToast(msg) { const t = document.getElementById("toast"); t.innerText = msg; t.className = "show"; setTimeout(() => t.className = "", 3000); }
    
    // Modal
    function openInputModal(title, callback) { document.getElementById('input-modal-title').innerText = title; currentCallback = callback; document.getElementById('input-modal').style.display = 'flex'; }
    function closeInputModal() { document.getElementById('input-modal').style.display = 'none'; }
    function processModal() { currentCallback(document.getElementById('modal-input').value); document.getElementById('modal-input').value = ""; closeInputModal(); }

    function addSongs(e) {
        for (let file of e.target.files) library[0].items.push({ name: file.name, src: URL.createObjectURL(file), addedDate: new Date() });
        renderPlaylist(); showToast("Đã thêm bài hát");
    }

    function createPlaylist(name) {
        if(name) { library.push({ name, items: [] }); updateSelect(); showToast("Playlist: " + name); }
    }

    function updateSelect() {
        const sel = document.getElementById('playlist-select');
        sel.innerHTML = library.map((p, idx) => `<option value="${idx}">${p.name}</option>`).join("");
    }

    function renderPlaylist() {
        const listEl = document.getElementById('playlist'), idx = document.getElementById('playlist-select').value;
        listEl.innerHTML = "";
        library[idx].items.forEach((song, i) => {
            let li = document.createElement('li');
            li.innerHTML = `<span class="song-name" onclick="playSong(${idx}, ${i})">${song.name}</span>
                            <span class="menu-btn" onclick="openSelectModal(${idx}, ${i})">⋮</span>`;
            listEl.appendChild(li);
        });
    }

    function openSelectModal(pIdx, sIdx) {
        songToAdd = library[pIdx].items[sIdx];
        const sel = document.getElementById('target-playlist-select');
        sel.innerHTML = library.map((p, idx) => `<option value="${idx}">${p.name}</option>`).join("");
        document.getElementById('select-modal').style.display = 'flex';
    }
    function closeSelectModal() { document.getElementById('select-modal').style.display = 'none'; }
    function confirmAddToPlaylist() {
        let idx = document.getElementById('target-playlist-select').value;
        library[idx].items.push(songToAdd);
        showToast("Đã thêm vào " + library[idx].name);
        closeSelectModal();
    }

    function sortPlaylist() {
        const val = document.getElementById('sort-select').value, idx = document.getElementById('playlist-select').value;
        if (val === 'alpha') library[idx].items.sort((a, b) => a.name.localeCompare(b.name));
        else if (val === 'date') library[idx].items.sort((a, b) => b.addedDate - a.addedDate);
        renderPlaylist(); showToast("Đã sắp xếp");
    }

    function playSong(pIdx, i) {
        playlistIndex = pIdx; index = i;
        audio.src = library[pIdx].items[i].src;
        audio.play(); title.innerText = library[pIdx].items[i].name; playBtn.innerText = "⏸️"; showPlayer();
    }

    function togglePlay() { 
        if (audio.paused) { audio.play(); playBtn.innerText = "⏸️"; }
        else { audio.pause(); playBtn.innerText = "▶️"; }
    }

    function nextSong() {
        const items = library[playlistIndex].items;
        if(items.length > 0) {
            index = isShuffle ? Math.floor(Math.random() * items.length) : (index + 1) % items.length;
            playSong(playlistIndex, index);
        }
    }
    
    function prevSong() {
        const items = library[playlistIndex].items;
        if(items.length > 0) {
            index = (index - 1 + items.length) % items.length;
            playSong(playlistIndex, index);
        }
    }

    // Xử lý thời gian
    audio.ontimeupdate = () => {
        if(audio.duration) {
            progress.style.width = (audio.currentTime / audio.duration) * 100 + "%";
            currTimeEl.innerText = formatTime(audio.currentTime);
            durTimeEl.innerText = formatTime(audio.duration);
        }
    };
    function formatTime(time) {
        let m = Math.floor(time / 60);
        let s = Math.floor(time % 60);
        return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function seek(e) { if(audio.duration) audio.currentTime = (e.offsetX / e.target.clientWidth) * audio.duration; }
    function showList() { document.getElementById('player-screen').style.display = 'none'; document.getElementById('list-screen').style.display = 'flex'; updateSelect(); renderPlaylist(); }
    function showPlayer() { document.getElementById('player-screen').style.display = 'flex'; document.getElementById('list-screen').style.display = 'none'; }
    
    audio.onended = () => { if (!isLoop) nextSong(); };
    updateSelect();
</script>
</body>
</html>
